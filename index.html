<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座席抽選</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --yellow:   #FFD84D;
      --blue:     #5AC8FA;
      --dark:     #111111;
      --btn-text: #111111;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #E8E8E8;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
    }

    .card {
      background: var(--yellow);
      border-radius: 20px;
      padding: 28px;
      width: min(400px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.18);
    }

    /* スマホ: 全画面レイアウト */
    @media (max-width: 480px) {
      body {
        background: var(--yellow);
        align-items: flex-start;
      }
      .card {
        width: 100%;
        min-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
        padding: 48px 24px 32px;
        justify-content: center;
      }
    }

    /* タッチデバイス全般（スマホ・iPad）: ボタンを大きく */
    @media (pointer: coarse) {
      .draw-btn {
        padding: 64px 0;
        font-size: 52px;
      }
    }

    .hero-image {
      display: none;
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      border-radius: 10px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      color: var(--dark);
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* ── Result box ── */
    .result-box {
      background: #ffffff;
      border-radius: 12px;
      aspect-ratio: 5 / 2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .result-text {
      font-weight: 800;
      font-size: 88px;
      color: var(--dark);
      letter-spacing: -1px;
      user-select: none;
      transition: font-size 0.08s;
    }

    .result-text.empty {
      font-size: 72px;
      font-weight: 300;
      color: #888;
      letter-spacing: 0;
    }

    .result-text.rolling {
      color: #BBBBBB;
      transition: color 0.1s;
    }

    @keyframes popIn {
      0%   { transform: scale(0.6); opacity: 0; }
      65%  { transform: scale(1.1); }
      100% { transform: scale(1);   opacity: 1; }
    }

    .result-text.popped {
      animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* ── Draw button ── */
    .draw-btn {
      background: var(--blue);
      border: none;
      border-radius: 12px;
      padding: 50px 0;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 8px;
      color: var(--btn-text);
      cursor: pointer;
      width: 100%;
      font-family: inherit;
      box-shadow: 0 5px 0 rgba(0,0,0,0.15);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .draw-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 8px 0 rgba(0,0,0,0.15);
    }

    .draw-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 3px 0 rgba(0,0,0,0.15);
    }

    .draw-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* ── No seats banner ── */
    .no-seats {
      display: none;
      background: rgba(0,0,0,0.06);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      color: #444;
      text-align: center;
      line-height: 1.6;
    }

    /* ── Footer ── */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .remaining {
      font-size: 13px;
      color: #444;
    }

    .reset-btn {
      background: none;
      border: 1px solid #888;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 12px;
      color: #555;
      cursor: pointer;
      font-family: inherit;
    }

    .reset-btn:hover { background: rgba(0,0,0,0.08); }

    .settings-link {
      font-size: 13px;
      color: #444;
      text-decoration: none;
    }

    .settings-link:hover { color: #000; }

    /* ── QR Modal ── */
    .qr-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .qr-overlay.show { display: flex; }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    .qr-card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 28px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: min(320px, 88vw);
      animation: modalIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .qr-seat {
      font-size: 40px;
      font-weight: 800;
      color: var(--dark);
      letter-spacing: -1px;
    }

    /* ── 数字のみモード ── */
    .qr-label {
      display: none;
      font-size: 20px;
      font-weight: 500;
      color: #555;
      order: 1;
    }

    .qr-card.number-only {
      padding: 16px 28px 40px;
      gap: 20px;
      width: min(340px, 88vw);
    }


    .qr-card.number-only .qr-label {
      display: block;
      order: 1;
    }

    .qr-card.number-only .qr-seat {
      font-size: 96px;
      letter-spacing: -3px;
      line-height: 1;
      order: 2;
    }

    .qr-code-wrap {
      background: #fff;
      padding: 8px;
      border-radius: 10px;
      border: 1.5px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-hint {
      font-size: 12px;
      color: #999;
      line-height: 1.5;
    }

    .qr-close {
      background: none;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 14px;
      font-weight: 600;
      color: #aaa;
      cursor: pointer;
      font-family: inherit;
      align-self: flex-end;
      order: -1;
    }

    .qr-close:hover { background: #f0f0f0; color: #666; }
  </style>
</head>
<body>
  <div class="card">
    <img class="hero-image" id="heroImage" alt="">
    <div class="title" id="pageTitle"></div>
    <div class="result-box">
      <div class="result-text empty" id="result">－</div>
    </div>

    <div class="no-seats" id="noSeats">
      抽選できる座席がありません。<br>リセットしてください。
    </div>

    <button class="draw-btn" id="drawBtn" onclick="startDraw()">抽選</button>

    <div class="footer">
      <div class="footer-left">
        <span class="remaining" id="remaining"></span>
      </div>
      <a class="settings-link" href="settings.html">⚙ 設定</a>
    </div>
  </div>

  <!-- QR Modal -->
  <div class="qr-overlay" id="qrOverlay" onclick="closeQR()">
    <div class="qr-card" onclick="event.stopPropagation()">
      <div class="qr-label">あなたの座席番号は</div>
      <div class="qr-seat" id="qrSeat"></div>
      <div class="qr-code-wrap" id="qrCodeWrap">
        <div id="qrCode"></div>
      </div>
      <div class="qr-hint" id="qrHint">QRコードを読み取ると<br>席番号を確認できます</div>
      <button class="qr-close" onclick="closeQR()">閉じる</button>
    </div>
  </div>

  <script>
    // ── Defaults & helpers ────────────────────────────────────────────────────

    function defaultSettings() {
      return {
        sections: [{ id: 1, prefix: 'A', separator: '-', start: 1, end: 30, zeroPad: 0 }],
        allowRepeat: false
      };
    }

    function generateSeats(sections) {
      const seats = [];
      for (const s of sections) {
        const start = parseInt(s.start) || 1;
        const end   = parseInt(s.end)   || 1;
        const pad   = parseInt(s.zeroPad) || 0;
        for (let n = start; n <= end; n++) {
          const num  = pad > 0 ? String(n).padStart(pad, '0') : String(n);
          const seat = s.prefix ? `${s.prefix}${s.separator}${num}` : num;
          seats.push(seat);
        }
      }
      return seats;
    }

    function loadState() {
      const raw         = localStorage.getItem('lotterySettings');
      const settings    = raw ? JSON.parse(raw) : defaultSettings();
      const allSeats    = generateSeats(settings.sections);
      const drawnRaw    = localStorage.getItem('drawnSeats');
      const drawn       = new Set(drawnRaw ? JSON.parse(drawnRaw) : []);
      const excludedRaw = localStorage.getItem('excludedSeats');
      const excluded    = new Set(excludedRaw ? JSON.parse(excludedRaw) : []);
      const activeSeats = allSeats.filter(s => !excluded.has(s));
      return { settings, allSeats, activeSeats, drawn };
    }

    function setFontSize(el, text) {
      const len = text.length;
      if      (len <= 2) el.style.fontSize = '96px';
      else if (len <= 4) el.style.fontSize = '88px';
      else if (len <= 6) el.style.fontSize = '72px';
      else if (len <= 8) el.style.fontSize = '56px';
      else               el.style.fontSize = '42px';
    }

    // ── UI ───────────────────────────────────────────────────────────────────

    function updateUI() {
      const { settings, activeSeats, drawn } = loadState();
      const available = settings.allowRepeat
        ? activeSeats.length
        : activeSeats.filter(s => !drawn.has(s)).length;

      const remainingEl = document.getElementById('remaining');
      const noSeats     = document.getElementById('noSeats');
      const drawBtn     = document.getElementById('drawBtn');

      if (settings.allowRepeat) {
        remainingEl.textContent = `全 ${activeSeats.length} 席`;
      } else {
        remainingEl.textContent = `残り ${available} / ${activeSeats.length} 席`;
      }

      const exhausted = !settings.allowRepeat && available === 0 && activeSeats.length > 0;
      noSeats.style.display = exhausted ? 'block' : 'none';
      drawBtn.style.display = exhausted ? 'none'  : 'block';
    }

    // ── Animation ────────────────────────────────────────────────────────────

    let isAnimating = false;

    function startDraw() {
      if (isAnimating) return;

      const { settings, activeSeats, drawn } = loadState();
      const available = settings.allowRepeat
        ? [...activeSeats]
        : activeSeats.filter(s => !drawn.has(s));

      if (available.length === 0) { updateUI(); return; }

      const finalSeat = available[Math.floor(Math.random() * available.length)];
      runAnimation(finalSeat, activeSeats.length > 0 ? activeSeats : available, settings, drawn);
    }

    function runAnimation(finalSeat, pool, settings, drawn) {
      isAnimating = true;
      const resultEl = document.getElementById('result');
      const drawBtn  = document.getElementById('drawBtn');

      drawBtn.disabled = true;
      resultEl.classList.remove('empty', 'popped');
      resultEl.classList.add('rolling');

      // 設定値に応じてアニメーション時間を動的生成
      const animMs = settings.animDuration || 1000;
      const base   = [45, 56, 70, 88, 110, 137, 171, 214, 109]; // 合計1000ms
      const scale  = animMs / 1000;
      const delays = base.map(d => Math.round(d * scale));

      function step(i) {
        if (i >= delays.length) {
          resultEl.classList.remove('rolling', 'popped');
          void resultEl.offsetWidth; // restart animation
          resultEl.textContent = finalSeat;
          setFontSize(resultEl, finalSeat);
          resultEl.classList.add('popped');
          playWinSE();
          setTimeout(() => showQRModal(finalSeat), 600);

          if (!settings.allowRepeat) {
            drawn.add(finalSeat);
            localStorage.setItem('drawnSeats', JSON.stringify([...drawn]));
          }

          drawBtn.disabled = false;
          isAnimating = false;
          updateUI();
          return;
        }

        setTimeout(() => {
          const rand = pool[Math.floor(Math.random() * pool.length)];
          resultEl.textContent = rand;
          setFontSize(resultEl, rand);
          step(i + 1);
        }, delays[i]);
      }

      step(0);
    }

    // ── Sound effect ─────────────────────────────────────────────────────────

    function playWinSE() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();

      // 3音のファンファーレ: C5 → E5 → G5
      const notes = [
        { freq: 523.25, start: 0,    dur: 0.18 },
        { freq: 659.25, start: 0.16, dur: 0.18 },
        { freq: 783.99, start: 0.32, dur: 0.38 },
      ];

      notes.forEach(({ freq, start, dur }) => {
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type      = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + start);

        gain.gain.setValueAtTime(0, ctx.currentTime + start);
        gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + dur);
      });
    }

    // ── QR Modal ─────────────────────────────────────────────────────────────

    function showQRModal(seat) {
      const raw      = localStorage.getItem('lotterySettings');
      const settings = raw ? JSON.parse(raw) : defaultSettings();
      const mode     = settings.popupMode || 'qr';

      const card      = document.querySelector('.qr-card');
      const codeWrap  = document.getElementById('qrCodeWrap');
      const hint      = document.getElementById('qrHint');
      const seatEl    = document.getElementById('qrSeat');

      seatEl.textContent = seat;

      if (mode === 'qr') {
        card.classList.remove('number-only');
        codeWrap.style.display = '';
        hint.style.display     = '';
        const container = document.getElementById('qrCode');
        container.innerHTML = '';
        const seatUrl = new URL('seat.html', window.location.href);
        seatUrl.searchParams.set('seat', seat);
        new QRCode(container, {
          text: seatUrl.toString(),
          width: 200,
          height: 200,
          correctLevel: QRCode.CorrectLevel.M
        });
      } else {
        card.classList.add('number-only');
        codeWrap.style.display = 'none';
        hint.style.display     = 'none';
      }

      document.getElementById('qrOverlay').classList.add('show');
    }

    function closeQR() {
      document.getElementById('qrOverlay').classList.remove('show');
    }

    // ── Reset ────────────────────────────────────────────────────────────────

    function resetDrawn() {
      if (!confirm('抽選履歴をリセットしますか？')) return;
      localStorage.removeItem('drawnSeats');
      const resultEl      = document.getElementById('result');
      resultEl.textContent = '－';
      resultEl.className   = 'result-text empty';
      resultEl.style.fontSize = '';
      updateUI();
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    function init() {
      const raw      = localStorage.getItem('lotterySettings');
      const settings = raw ? JSON.parse(raw) : defaultSettings();

      // カラーテーマを適用
      const root = document.documentElement;
      if (settings.colorBg)      root.style.setProperty('--yellow',   settings.colorBg);
      if (settings.colorBtn)     root.style.setProperty('--blue',     settings.colorBtn);
      if (settings.colorBtnText) root.style.setProperty('--btn-text', settings.colorBtnText);

      document.getElementById('pageTitle').textContent = settings.title || '座席抽選';
      const heroImg = document.getElementById('heroImage');
      if (settings.imageUrl) {
        heroImg.src          = settings.imageUrl;
        heroImg.style.display = 'block';
        heroImg.onerror      = () => { heroImg.style.display = 'none'; };
      }
      updateUI();
    }

    init();
  </script>
</body>
</html>
