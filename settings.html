<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>設定 - 座席抽選</title>
  <style>
    :root {
      --yellow: #FFD84D;
      --blue:   #5AC8FA;
      --dark:   #111111;
      --bg:     #E8E8E8;
      --card:   #ffffff;
      --border: #D8D8D8;
      --muted:  #888;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      min-height: 100dvh;
      font-family: -apple-system, 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
      color: var(--dark);
    }

    /* ── Header ── */
    .header {
      background: var(--yellow);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back-link {
      font-size: 14px;
      color: #444;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .back-link:hover { color: #000; }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
    }

    /* ── Page body ── */
    .page {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px 80px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Section card ── */
    .section-card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .delete-btn {
      background: none;
      border: none;
      font-size: 13px;
      color: #cc4444;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-family: inherit;
    }

    .delete-btn:hover { background: #fff0f0; }
    .delete-btn:disabled { color: #ccc; cursor: default; background: none; }

    /* ── Form rows ── */
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field.full { grid-column: 1 / -1; }

    label {
      font-size: 12px;
      font-weight: 600;
      color: #555;
    }

    input[type="text"],
    input[type="number"],
    select {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 16px;
      font-family: inherit;
      color: var(--dark);
      background: #fafafa;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: var(--blue);
      background: #fff;
    }

    input::placeholder { color: #bbb; }

    /* ── Preview chip ── */
    .preview {
      background: #f4f4f4;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #555;
      line-height: 1.5;
      word-break: break-all;
    }

    .preview strong { color: var(--dark); }

    /* ── Add section ── */
    .add-btn {
      background: none;
      border: 2px dashed #C0C0C0;
      border-radius: 14px;
      padding: 16px;
      font-size: 15px;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s, color 0.15s;
    }

    .add-btn:hover { border-color: #999; color: #444; }

    /* ── Option card ── */
    .option-card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .toggle-label-text {
      font-size: 15px;
      font-weight: 500;
    }

    .toggle-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Toggle switch */
    .toggle-wrap {
      position: relative;
      width: 44px;
      height: 26px;
      flex-shrink: 0;
    }

    .toggle-wrap input { opacity: 0; width: 0; height: 0; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 99px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle-wrap input:checked + .toggle-track { background: var(--blue); }
    .toggle-wrap input:checked + .toggle-track::after { transform: translateX(18px); }

    /* ── Status card ── */
    .status-card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .stat-block {
      text-align: center;
      flex: 1;
      background: #f4f4f4;
      border-radius: 10px;
      padding: 10px 8px;
    }

    .stat-num {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .stat-num.remaining { color: #1a9f4e; }
    .stat-num.drawn     { color: #cc4444; }
    .stat-num.excluded  { color: #E65100; }
    .stat-num.total     { color: #555; }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .seat-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }

    .seat-chip {
      background: #e8f7ff;
      border: 1.5px solid var(--blue);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--dark);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.1s;
    }

    .seat-chip:hover:not(.drawn) { opacity: 0.75; }

    .seat-chip.drawn {
      background: #f0f0f0;
      border-color: #ccc;
      color: #bbb;
      text-decoration: line-through;
      cursor: default;
    }

    .seat-chip.excluded {
      background: #fff3e0;
      border-color: #FFA726;
      color: #E65100;
      text-decoration: line-through;
    }

    .grid-hint {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
    }

    .no-history {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      padding: 8px 0;
    }

    .small-reset-btn {
      background: none;
      border: 1px solid #cc4444;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      color: #cc4444;
      cursor: pointer;
      font-family: inherit;
    }

    .small-reset-btn:hover { background: #fff0f0; }
    .small-reset-btn:disabled { border-color: #ccc; color: #ccc; cursor: default; background: none; }

    /* ── Append seats button ── */
    .append-btn {
      background: #1a9f4e;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
      transition: opacity 0.15s;
    }

    .append-btn:hover { opacity: 0.85; }

    .append-card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 2px solid #d4f0e0;
    }

    .append-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #1a9f4e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .append-note {
      font-size: 12px;
      color: var(--muted);
      margin-top: -6px;
    }

    /* ── Segmented control ── */
    .segment {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #EFEFEF;
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .segment input { display: none; }

    .segment label {
      display: block;
      text-align: center;
      padding: 9px 0;
      font-size: 14px;
      font-weight: 600;
      color: #888;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .segment input:checked + label {
      background: #fff;
      color: var(--dark);
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }

    /* ── Color pickers ── */
    .color-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="color"] {
      width: 40px;
      height: 40px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      padding: 3px;
      background: #fafafa;
      flex-shrink: 0;
    }

    .color-hex {
      font-size: 13px;
      font-family: 'SF Mono', 'Menlo', monospace;
      color: #555;
      flex: 1;
    }

    .color-reset-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    .color-reset-btn:hover { background: #f0f0f0; }

    /* ── Color preview mini mock ── */
    .cp-wrap {
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid #e0e0e0;
      margin-top: 4px;
    }

    .cp-card {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      transition: background 0.15s;
    }

    .cp-title-text {
      font-size: 13px;
      font-weight: 800;
      color: var(--dark);
    }

    .cp-result {
      background: #fff;
      border-radius: 6px;
      padding: 10px 0;
      font-size: 26px;
      font-weight: 800;
      color: #111;
      width: 100%;
      text-align: center;
      letter-spacing: -1px;
    }

    .cp-btn {
      border-radius: 6px;
      padding: 12px 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 5px;
      width: 100%;
      text-align: center;
      transition: background 0.15s, color 0.15s;
    }

    .cp-label {
      font-size: 10px;
      color: rgba(0,0,0,0.35);
      align-self: flex-end;
    }

    /* ── Apply image button ── */
    .apply-btn {
      background: var(--blue);
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 700;
      color: var(--dark);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    .apply-btn:hover { opacity: 0.8; }

    /* ── Save button ── */
    .save-btn {
      background: var(--yellow);
      border: none;
      border-radius: 14px;
      padding: 18px;
      font-size: 18px;
      font-weight: 800;
      color: var(--dark);
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 0 rgba(0,0,0,0.12);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 rgba(0,0,0,0.12);
    }

    .save-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.12);
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #222;
      color: #fff;
      padding: 12px 24px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 500;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="header">
    <a class="back-link" href="index.html">← 戻る</a>
    <h1>座席設定</h1>
  </div>

  <div class="page">
    <div class="option-card">
      <div class="field">
        <label>タイトル</label>
        <input type="text" id="titleInput" placeholder="例: 座席抽選" maxlength="40">
      </div>
    </div>

    <div class="option-card">
      <div class="field">
        <label>画像 URL（省略可）</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="url" id="imageUrlInput" placeholder="https://example.com/image.png" style="flex:1;">
          <button class="apply-btn" id="applyImageBtn" onclick="saveImageUrl()">適用</button>
        </div>
      </div>
      <div id="imagePreview" style="display:none; margin-top:12px; text-align:center;">
        <img id="previewImg" style="max-width:100%; max-height:160px; border-radius:8px; object-fit:contain;">
        <div id="imageError" style="display:none; font-size:12px; color:#cc4444; margin-top:6px;">画像を読み込めませんでした</div>
      </div>
    </div>

    <!-- カラーカスタマイズ -->
    <div class="option-card">
      <div class="section-title" style="margin-bottom:14px;">カラーカスタマイズ</div>

      <div class="field">
        <label>背景色</label>
        <div class="color-row">
          <input type="color" id="colorBg" value="#FFD84D" oninput="onColorChange()">
          <span class="color-hex" id="colorBgHex">#FFD84D</span>
          <button class="color-reset-btn" onclick="resetColor('colorBg','#FFD84D')">リセット</button>
        </div>
      </div>

      <div class="field">
        <label>抽選ボタンの色</label>
        <div class="color-row">
          <input type="color" id="colorBtn" value="#5AC8FA" oninput="onColorChange()">
          <span class="color-hex" id="colorBtnHex">#5AC8FA</span>
          <button class="color-reset-btn" onclick="resetColor('colorBtn','#5AC8FA')">リセット</button>
        </div>
      </div>

      <div class="field">
        <label>抽選ボタンの文字色</label>
        <div class="color-row">
          <input type="color" id="colorBtnText" value="#111111" oninput="onColorChange()">
          <span class="color-hex" id="colorBtnTextHex">#111111</span>
          <button class="color-reset-btn" onclick="resetColor('colorBtnText','#111111')">リセット</button>
        </div>
      </div>

      <!-- ライブプレビュー -->
      <div class="cp-wrap">
        <div class="cp-card" id="cpCard">
          <div class="cp-title-text" id="cpTitle">座席抽選</div>
          <div class="cp-result">A-17</div>
          <div class="cp-btn" id="cpBtn">抽選</div>
          <div class="cp-label">プレビュー</div>
        </div>
      </div>
    </div>

    <div id="sectionList"></div>
    <button class="add-btn" onclick="addSection()">＋ セクション追加</button>

    <div class="option-card">
      <div class="field">
        <label>抽選アニメーション時間</label>
        <select id="animDuration">
          <option value="500">0.5秒</option>
          <option value="1000">1秒</option>
          <option value="1500">1.5秒</option>
          <option value="2000">2秒</option>
          <option value="2500">2.5秒</option>
          <option value="3000">3秒</option>
        </select>
      </div>
    </div>

    <div class="option-card">
      <div style="margin-bottom:12px;">
        <div class="toggle-label-text" style="margin-bottom:10px;">抽選後のポップアップ</div>
        <div class="segment">
          <input type="radio" name="popupMode" id="modeQr" value="qr" checked>
          <label for="modeQr">🔳 QRコード</label>
          <input type="radio" name="popupMode" id="modeNumber" value="number">
          <label for="modeNumber">🔢 数字のみ</label>
        </div>
      </div>
    </div>

    <div class="option-card">
      <div class="toggle-row">
        <div>
          <div class="toggle-label-text">抽選済みを再抽選に含める</div>
          <div class="toggle-sub">ONにすると同じ座席が複数回抽選されます</div>
        </div>
        <label class="toggle-wrap">
          <input type="checkbox" id="allowRepeat">
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>

    <div class="append-card">
      <div class="append-title">＋ 席を追加（抽選中）</div>
      <div class="append-note">抽選済み・除外の履歴を保持したまま席を追加できます</div>

      <div class="field-row">
        <div class="field">
          <label>プレフィックス</label>
          <input type="text" id="addPrefix" placeholder="例: B（省略可）"
            oninput="updateAddPreview()">
        </div>
        <div class="field">
          <label>区切り文字</label>
          <input type="text" id="addSeparator" value="-"
            oninput="updateAddPreview()">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>開始番号</label>
          <input type="number" id="addStart" value="1" min="0"
            oninput="updateAddPreview()">
        </div>
        <div class="field">
          <label>終了番号</label>
          <input type="number" id="addEnd" value="10" min="0"
            oninput="updateAddPreview()">
        </div>
      </div>

      <div class="preview" id="addPreview"></div>
      <button class="append-btn" onclick="appendSeats()">＋ この席を追加する</button>
    </div>

    <div class="status-card">
      <div class="status-header">
        <span class="section-title">残席状況</span>
        <button class="small-reset-btn" id="statusResetBtn" onclick="resetDrawnFromSettings()">履歴リセット</button>
      </div>
      <div class="status-summary" id="statusSummary"></div>
      <div class="seat-grid" id="seatGrid"></div>
      <div class="grid-hint">タップで除外 / 再タップで解除</div>
    </div>

    <button class="save-btn" onclick="saveSettings()">設定を保存</button>

    <div style="text-align:center; padding: 8px 0 4px;">
      <a href="manual.html" style="font-size:13px; color:#888; text-decoration:none; display:inline-flex; align-items:center; gap:5px;">
        📖 操作マニュアルを見る
      </a>
    </div>
  </div>

  <div class="toast" id="toast">保存しました</div>

  <script>
    // ── State ────────────────────────────────────────────────────────────────

    let sections = [];
    let nextId   = 1;

    function defaultSettings() {
      return {
        title: '座席抽選',
        imageUrl: '',
        popupMode: 'qr',
        animDuration: 1000,
        colorBg:      '#FFD84D',
        colorBtn:     '#5AC8FA',
        colorBtnText: '#111111',
        sections: [{ id: 1, prefix: 'A', separator: '-', start: 1, end: 30, zeroPad: 0 }],
        allowRepeat: false
      };
    }

    // ── Seat generation (for preview) ────────────────────────────────────────

    function generateSeats(s) {
      const start = parseInt(s.start) || 1;
      const end   = parseInt(s.end)   || 1;
      const pad   = parseInt(s.zeroPad) || 0;
      const seats = [];
      for (let n = start; n <= end; n++) {
        const num  = pad > 0 ? String(n).padStart(pad, '0') : String(n);
        const seat = s.prefix ? `${s.prefix}${s.separator}${num}` : num;
        seats.push(seat);
      }
      return seats;
    }

    function previewText(s) {
      const seats = generateSeats(s);
      if (seats.length === 0) return '（座席なし）';
      const count = seats.length;
      if (count <= 6) return `${seats.join(', ')}　（${count} 席）`;
      const head = seats.slice(0, 3).join(', ');
      const tail = seats.slice(-2).join(', ');
      return `${head}, … , ${tail}　（${count} 席）`;
    }

    // ── Render ───────────────────────────────────────────────────────────────

    function render() {
      const list = document.getElementById('sectionList');
      list.innerHTML = '';

      sections.forEach((s, idx) => {
        const card = document.createElement('div');
        card.className  = 'section-card';
        card.dataset.id = s.id;

        card.innerHTML = `
          <div class="section-header">
            <span class="section-title">セクション ${idx + 1}</span>
            <button class="delete-btn" onclick="removeSection(${s.id})"
              ${sections.length === 1 ? 'disabled' : ''}>削除</button>
          </div>

          <div class="field-row">
            <div class="field">
              <label>プレフィックス</label>
              <input type="text" placeholder="例: A, VIP（省略可）"
                value="${esc(s.prefix)}"
                oninput="updateField(${s.id}, 'prefix', this.value)">
            </div>
            <div class="field">
              <label>区切り文字</label>
              <input type="text" placeholder="例: - （省略可）"
                value="${esc(s.separator)}"
                oninput="updateField(${s.id}, 'separator', this.value)">
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label>開始番号</label>
              <input type="number" min="0" value="${s.start}"
                oninput="updateField(${s.id}, 'start', this.value)">
            </div>
            <div class="field">
              <label>終了番号</label>
              <input type="number" min="0" value="${s.end}"
                oninput="updateField(${s.id}, 'end', this.value)">
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label>桁数揃え（ゼロ埋め）</label>
              <select onchange="updateField(${s.id}, 'zeroPad', this.value)">
                <option value="0"  ${s.zeroPad == 0 ? 'selected' : ''}>なし（1, 2, 3…）</option>
                <option value="2"  ${s.zeroPad == 2 ? 'selected' : ''}>2桁（01, 02…）</option>
                <option value="3"  ${s.zeroPad == 3 ? 'selected' : ''}>3桁（001, 002…）</option>
                <option value="4"  ${s.zeroPad == 4 ? 'selected' : ''}>4桁（0001, 0002…）</option>
              </select>
            </div>
          </div>

          <div class="preview" id="preview-${s.id}"></div>
        `;

        list.appendChild(card);
        updatePreview(s.id);
      });
    }

    function updatePreview(id) {
      const s   = sections.find(x => x.id === id);
      const el  = document.getElementById(`preview-${id}`);
      if (!s || !el) return;
      el.innerHTML = `<strong>プレビュー:</strong> ${previewText(s)}`;
    }

    function esc(str) {
      return String(str ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    }

    // ── Mutations ────────────────────────────────────────────────────────────

    function updateField(id, key, value) {
      const s = sections.find(x => x.id === id);
      if (!s) return;
      s[key] = key === 'start' || key === 'end' || key === 'zeroPad'
        ? parseInt(value) || 0
        : value;
      updatePreview(id);
    }

    function addSection() {
      nextId++;
      sections.push({ id: nextId, prefix: '', separator: '-', start: 1, end: 30, zeroPad: 0 });
      render();
      // Scroll new card into view
      const cards = document.querySelectorAll('.section-card');
      cards[cards.length - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function removeSection(id) {
      if (sections.length === 1) return;
      sections = sections.filter(s => s.id !== id);
      render();
    }

    // ── Persist ───────────────────────────────────────────────────────────────

    function saveSettings() {
      // Validate
      for (const s of sections) {
        if (parseInt(s.start) > parseInt(s.end)) {
          alert(`セクション「${s.prefix || '#' + s.id}」の開始番号が終了番号より大きいです。`);
          return;
        }
      }

      const hadDrawn    = !!localStorage.getItem('drawnSeats');
      const hadExcluded = !!localStorage.getItem('excludedSeats');
      if (hadDrawn || hadExcluded) {
        const ok = confirm('設定を変更すると抽選履歴・除外リストがリセットされます。続けますか？');
        if (!ok) return;
        localStorage.removeItem('drawnSeats');
        localStorage.removeItem('excludedSeats');
      }

      const allowRepeat   = document.getElementById('allowRepeat').checked;
      const title         = document.getElementById('titleInput').value.trim() || '座席抽選';
      const imageUrl      = document.getElementById('imageUrlInput').value.trim();
      const popupMode     = document.querySelector('input[name="popupMode"]:checked').value;
      const animDuration  = parseInt(document.getElementById('animDuration').value) || 1000;
      const colorBg       = document.getElementById('colorBg').value;
      const colorBtn      = document.getElementById('colorBtn').value;
      const colorBtnText  = document.getElementById('colorBtnText').value;
      localStorage.setItem('lotterySettings', JSON.stringify({
        title, imageUrl, popupMode, animDuration,
        colorBg, colorBtn, colorBtnText,
        sections, allowRepeat
      }));
      window.location.href = 'index.html';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ── Status panel ─────────────────────────────────────────────────────────

    function allSeatsFromStorage() {
      const raw      = localStorage.getItem('lotterySettings');
      const settings = raw ? JSON.parse(raw) : defaultSettings();
      return settings.sections.flatMap(s => generateSeats(s));
    }

    function renderStatus() {
      const allSeats   = allSeatsFromStorage();
      const drawnRaw   = localStorage.getItem('drawnSeats');
      const drawn      = new Set(drawnRaw ? JSON.parse(drawnRaw) : []);
      const excludedRaw = localStorage.getItem('excludedSeats');
      const excluded   = new Set(excludedRaw ? JSON.parse(excludedRaw) : []);

      const total      = allSeats.length;
      const drawnCnt   = allSeats.filter(s => drawn.has(s)).length;
      const excludedCnt = allSeats.filter(s => excluded.has(s) && !drawn.has(s)).length;
      const remaining  = total - drawnCnt - excludedCnt;

      document.getElementById('statusSummary').innerHTML = `
        <div class="stat-block">
          <div class="stat-num remaining">${remaining}</div>
          <div class="stat-label">残り</div>
        </div>
        <div class="stat-block">
          <div class="stat-num drawn">${drawnCnt}</div>
          <div class="stat-label">抽選済み</div>
        </div>
        <div class="stat-block">
          <div class="stat-num excluded">${excludedCnt}</div>
          <div class="stat-label">除外</div>
        </div>
        <div class="stat-block">
          <div class="stat-num total">${total}</div>
          <div class="stat-label">合計</div>
        </div>
      `;

      const grid = document.getElementById('seatGrid');
      if (total === 0) {
        grid.innerHTML = '<div class="no-history">座席が設定されていません</div>';
      } else {
        grid.innerHTML = allSeats.map(seat => {
          const isDrawn    = drawn.has(seat);
          const isExcluded = !isDrawn && excluded.has(seat);
          const cls = isDrawn ? 'drawn' : isExcluded ? 'excluded' : '';
          return `<span class="seat-chip ${cls}" data-seat="${seat}">${seat}</span>`;
        }).join('');
      }

      document.getElementById('statusResetBtn').disabled = drawnCnt === 0;
    }

    function toggleExclude(seat) {
      const drawnRaw = localStorage.getItem('drawnSeats');
      const drawn    = new Set(drawnRaw ? JSON.parse(drawnRaw) : []);
      if (drawn.has(seat)) return; // 抽選済みは除外不可

      const excludedRaw = localStorage.getItem('excludedSeats');
      const excluded    = new Set(excludedRaw ? JSON.parse(excludedRaw) : []);
      excluded.has(seat) ? excluded.delete(seat) : excluded.add(seat);
      localStorage.setItem('excludedSeats', JSON.stringify([...excluded]));
      renderStatus();
    }

    function resetDrawnFromSettings() {
      if (!confirm('抽選履歴をリセットしますか？')) return;
      localStorage.removeItem('drawnSeats');
      renderStatus();
    }

    // ── Init ─────────────────────────────────────────────────────────────────

    function init() {
      const raw      = localStorage.getItem('lotterySettings');
      const settings = raw ? JSON.parse(raw) : defaultSettings();
      sections = settings.sections.map(s => ({ ...s }));
      nextId   = Math.max(...sections.map(s => s.id), 0);
      document.getElementById('allowRepeat').checked = !!settings.allowRepeat;
      document.getElementById('titleInput').value    = settings.title    || '座席抽選';
      document.getElementById('imageUrlInput').value = settings.imageUrl || '';
      updateImagePreview(settings.imageUrl || '');
      const mode = settings.popupMode || 'qr';
      document.querySelector(`input[name="popupMode"][value="${mode}"]`).checked = true;
      document.getElementById('animDuration').value = settings.animDuration || 1000;

      // カラー設定を復元
      document.getElementById('colorBg').value      = settings.colorBg      || '#FFD84D';
      document.getElementById('colorBtn').value     = settings.colorBtn     || '#5AC8FA';
      document.getElementById('colorBtnText').value = settings.colorBtnText || '#111111';
      onColorChange();

      render();
      renderStatus();
    }

    // ── Color change handler ──────────────────────────────────────────────────

    function onColorChange() {
      const bg   = document.getElementById('colorBg').value;
      const btn  = document.getElementById('colorBtn').value;
      const text = document.getElementById('colorBtnText').value;

      document.getElementById('colorBgHex').textContent      = bg;
      document.getElementById('colorBtnHex').textContent     = btn;
      document.getElementById('colorBtnTextHex').textContent = text;

      // ライブプレビュー更新
      document.getElementById('cpCard').style.background = bg;
      document.getElementById('cpBtn').style.background  = btn;
      document.getElementById('cpBtn').style.color       = text;
      document.getElementById('cpTitle').style.color     = contrastText(bg);
    }

    function resetColor(id, defaultVal) {
      document.getElementById(id).value = defaultVal;
      onColorChange();
    }

    // 背景色に対して読みやすいテキスト色を返す（簡易輝度判定）
    function contrastText(hex) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return (r * 0.299 + g * 0.587 + b * 0.114) > 160 ? '#111111' : '#ffffff';
    }

    // ── Append seats (履歴保持) ──────────────────────────────────────────────

    function updateAddPreview() {
      const s = {
        prefix:    document.getElementById('addPrefix').value,
        separator: document.getElementById('addSeparator').value,
        start:     parseInt(document.getElementById('addStart').value) || 1,
        end:       parseInt(document.getElementById('addEnd').value)   || 1,
        zeroPad:   0
      };
      document.getElementById('addPreview').innerHTML =
        `<strong>プレビュー:</strong> ${previewText(s)}`;
    }

    function appendSeats() {
      const prefix    = document.getElementById('addPrefix').value;
      const separator = document.getElementById('addSeparator').value;
      const start     = parseInt(document.getElementById('addStart').value) || 1;
      const end       = parseInt(document.getElementById('addEnd').value)   || 1;

      if (start > end) {
        alert('開始番号が終了番号より大きいです。');
        return;
      }

      const raw      = localStorage.getItem('lotterySettings');
      const settings = raw ? JSON.parse(raw) : defaultSettings();
      const newId    = Math.max(...settings.sections.map(s => s.id), 0) + 1;
      settings.sections.push({ id: newId, prefix, separator, start, end, zeroPad: 0 });
      localStorage.setItem('lotterySettings', JSON.stringify(settings));

      // フォームに反映・ステータス更新
      sections = settings.sections.map(s => ({ ...s }));
      nextId   = Math.max(...sections.map(s => s.id), 0);
      render();
      renderStatus();

      // フォームをリセット
      document.getElementById('addPrefix').value    = '';
      document.getElementById('addSeparator').value = '-';
      document.getElementById('addStart').value     = '1';
      document.getElementById('addEnd').value       = '10';
      updateAddPreview();

      // ボタンにフィードバック
      const btn = document.querySelector('.append-btn');
      btn.textContent = '✓ 追加しました';
      btn.style.background = '#555';
      setTimeout(() => {
        btn.textContent = '＋ この席を追加する';
        btn.style.background = '';
      }, 1800);
    }

    // ── Image URL apply (履歴リセットなし) ──────────────────────────────────

    function saveImageUrl() {
      const url = document.getElementById('imageUrlInput').value.trim();
      const raw = localStorage.getItem('lotterySettings');
      const settings = raw ? JSON.parse(raw) : defaultSettings();
      settings.imageUrl = url;
      localStorage.setItem('lotterySettings', JSON.stringify(settings));
      const btn = document.getElementById('applyImageBtn');
      btn.textContent = '✓ 保存';
      setTimeout(() => { btn.textContent = '適用'; }, 1500);
    }

    // ── Image preview ────────────────────────────────────────────────────────

    function updateImagePreview(url) {
      const wrap  = document.getElementById('imagePreview');
      const img   = document.getElementById('previewImg');
      const err   = document.getElementById('imageError');
      if (!url) { wrap.style.display = 'none'; return; }
      wrap.style.display = 'block';
      err.style.display  = 'none';
      img.style.display  = 'block';
      img.src = url;
      img.onerror = () => { img.style.display = 'none'; err.style.display = 'block'; };
      img.onload  = () => { img.style.display = 'block'; err.style.display = 'none'; };
    }

    document.getElementById('imageUrlInput').addEventListener('input', e => {
      updateImagePreview(e.target.value.trim());
    });

    document.getElementById('titleInput').addEventListener('input', e => {
      document.getElementById('cpTitle').textContent = e.target.value.trim() || '座席抽選';
    });

    // 席グリッドのタップで除外トグル
    document.getElementById('seatGrid').addEventListener('click', e => {
      const chip = e.target.closest('.seat-chip');
      if (chip && !chip.classList.contains('drawn')) toggleExclude(chip.dataset.seat);
    });

    init();
    updateAddPreview();
  </script>
</body>
</html>
